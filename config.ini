# config.ini - the ONE place for settings of this build recipe (read by build.py and by the GitHub workflows on every run).
# Nothing here is polled: build.py reads it once per run, the workflows read it once per run.

[upstream]
# Where the Standard Notes source comes from (AGPL-3.0, public). Release tags look like @standardnotes/desktop@3.203.0.
# Desktop, mobile and web releases of one version share the same commit. The workflows CLONE it at build time: no upstream source is stored here.
repo = https://github.com/standardnotes/app.git
# To rebuild for the NEXT upstream release: change this one line (see HowToUse.md), push (or run the workflow by hand).
tag = @standardnotes/desktop@3.203.0

[patches]
# Patch folders, applied in this order with `git am --3way`. A patch that no longer applies STOPS the build loudly and names it.
# common    = small fixes to the sync (sync right after the server says "items changed", websocket reconnect with back-off, sync when the app returns to the front, quiet retries)
# mobile    = changes both phone apps need (open the push websocket)
# ios       = side-by-side bundle id + app name for the iPhone app, no entitlements a free Apple ID cannot sign
# android   = side-by-side app id + name for the Android app
# customserver = a custom sync server typed into the sign-in screen also gets its websocket (wss://HOST/ws, the URL path is kept)
# optional  = patches that cost something, off unless apply_optional = yes (the editor saves 350 ms after the last keystroke instead of 700 ms)
common = patches
mobile = patches/mobile
ios = patches/ios
android = patches/android
customserver = patches/customserver
optional = patches/optional
apply_optional = yes

[mobile]
# Presets baked into the phone apps when they are built: the sync server the app starts with and its websocket URL.
# They stay the HOSTED defaults here: this repository is public and holds no private address. A private server address is written into the finished
# app on YOUR computer afterwards (personalize_ipa.py / personalize_apk.py, settings in their own .ini files), never committed.
default_sync_server = https://api.standardnotes.com
websocket_url = wss://sockets.standardnotes.com

[builds]
# daily = the everyday build: no measuring hook, no WebView debugging.
flavor = daily

[version]
# Visible version string = <upstream version>-<suffix> (for example 3.203.0-fastsync)
suffix = fastsync

[ios]
bundle_id = com.standardnotes.fastsync
display_name = SN Fast
# Xcode majors to try, in this order. 26 = what upstream's own release workflow uses with this React Native version;
# 27 = the newest on GitHub's runners (automatic fallback job when 26 fails).
xcode_primary = 26
xcode_fallback = 27
# remove the Share extension from the IPA: it would need its own App ID of a free Apple account
strip_extensions = yes

[android]
application_id = com.standardnotes.fastsync
label = SN Fast
# only the phone's CPU type: smaller APK, shorter build. Use armeabi-v7a,arm64-v8a,x86,x86_64 for all.
abis = arm64-v8a
sdk_platform = android-36
build_tools = 36.0.0
ndk = 27.1.12297006
cmake = 3.22.1

[outputs]
# branch the workflows write the logs to (readable without any login: https://raw.githubusercontent.com/OWNER/REPO/build-logs/LATEST.txt)
logs_branch = build-logs
# how many pre-releases (ios-N) stay; older ones are removed by the workflow
keep_releases = 5
